name: Feature Run

on:
  push:
    branches:
      - feature
  pull_request:
    branches:
      - feature
  workflow_dispatch:
    inputs:
      run_live_test:
        description: 'Run the live Naukri Selenium test'
        required: false
        default: false
        type: boolean
  schedule:
    # 09:00-19:00 IST every 30 minutes, Monday-Friday
    - cron: '30 3 * * 1-5'
    - cron: '0,30 4-13 * * 1-5'

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Project
        run: mvn -B clean install -DskipTests

  run-updateprofile-test:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run updateprofile TestNG Test
        run: mvn -B test "-Dsurefire.suiteXmlFiles=testng.xml"
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          RUN_NAUKRI_LIVE_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_test || 'false' }}

      - name: Upload Debug Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-debug
          path: screenshots
          if-no-files-found: ignore
