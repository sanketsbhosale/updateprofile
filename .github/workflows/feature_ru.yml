name: Feature Run

on:
  push:
    branches:
      - feature
  pull_request:
    branches:
      - feature
  workflow_dispatch:
    inputs:
      run_live_test:
        description: 'Run the live Naukri Selenium test'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '*/30 * * * *'

jobs:
  build:
    runs-on: self-hosted
    outputs:
      should_run: ${{ steps.time_window.outputs.should_run }}

    steps:
      - name: Check IST Time Window
        id: time_window
        shell: bash
        run: |
          EVENT_NAME="${{ github.event_name }}"
          IST_HOUR=$(TZ=Asia/Kolkata date +%H)
          IST_TIME=$(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M:%S')
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Event is $EVENT_NAME. Skipping time-window check and continuing."
          elif ((10#$IST_HOUR >= 9 && 10#$IST_HOUR < 19)); then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Current IST time: $IST_TIME. Continuing workflow."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Current IST time: $IST_TIME. Skipping scheduled run outside 9AM-7PM IST."
          fi

      - name: Checkout Repository
        if: steps.time_window.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set Up JDK
        if: steps.time_window.outputs.should_run == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Project
        if: steps.time_window.outputs.should_run == 'true'
        run: mvn -B clean package -DskipTests

      - name: Skip Build Outside IST Window
        if: steps.time_window.outputs.should_run != 'true'
        run: echo "Build skipped because the workflow ran outside the allowed IST window."

  run-updateprofile-test:
    needs: build
    if: needs.build.outputs.should_run == 'true'
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run updateprofile TestNG Test
        run: mvn -B test "-Dsurefire.suiteXmlFiles=testng.xml"
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          RUN_NAUKRI_LIVE_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_test || 'false' }}

      - name: Upload Debug Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-debug
          path: screenshots
          if-no-files-found: ignore
