name: Feature Run

on:
  push:
    branches:
      - feature
  pull_request:
    branches:
      - feature
  workflow_dispatch:
    inputs:
      run_live_test:
        description: 'Run the live Naukri Selenium test'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '*/30 * * * *'

jobs:
  build:
    runs-on: self-hosted   # ✅ CHANGED

    steps:

      - name: Check IST Time Window
        run: |
          HOUR=$(TZ="Asia/Kolkata" date +%H)
          if [ $HOUR -lt 9 ] || [ $HOUR -ge 19 ]; then
            echo "Skipping execution outside 9AM–7PM IST"
            exit 0
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run TestNG Tests
        run: mvn -B clean test
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          RUN_NAUKRI_LIVE_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_test || 'false' }}

      - name: Upload Screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-debug
          path: ci_debug.png
