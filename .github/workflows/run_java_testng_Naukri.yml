name: Run TestNG Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '*/30 * * * *'

jobs:
  build:
    runs-on: windows-latest

    steps:

    - name: Check IST Time Window
      shell: pwsh
      run: |
        $hour = (Get-Date).ToUniversalTime().AddHours(5.5).Hour
        if ($hour -lt 9 -or $hour -ge 19) {
          Write-Host "Skipping execution outside 9AM–7PM IST"
          exit 0
        }

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set Up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Run TestNG Tests
      run: mvn -B clean test
      env:
        NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
        NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}

    - name: Upload Screenshot
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: screenshot
        path: ci_debug.png
